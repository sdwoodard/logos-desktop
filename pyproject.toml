[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
dependencies = [
#    "altgraph",
#    "certifi",
#    "charset-normalizer",
    "distro",
#    "idna",
    "packaging",
    "psutil",
    "pythondialog",
    "requests",
    "olefile>=0.47,<1",
    "zstandard>=0.23,<1",
    "inotify", # Required for watching when the auto-update setting changes
#    "urllib3",
	"textual",
]
name = "logos-desktop"
description = "Independent community installer and manager for Logos on Linux through Wine"
dynamic = ["readme", "version"]
requires-python = ">=3.12"

[project.optional-dependencies]
build = ["pyinstaller"]
dev = ["mypy", "ruff"]
gui = ["PySide6-Essentials>=6.12,<6.13"]

[project.scripts]
logos-desktop = "ou_dedetai.main:main"
oudedetai = "ou_dedetai.main:main"

[project.urls]
Source = "https://github.com/sdwoodard/logos-desktop"
Issues = "https://github.com/sdwoodard/logos-desktop/issues"

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/plain"}
version = {attr = "ou_dedetai.constants.LLI_CURRENT_VERSION"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"ou_dedetai.img" = ["*icon.png", "logos-desktop.svg", "lucide-LICENSE.txt", "ATTRIBUTION.md"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
warn_unreachable = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "ou_dedetai.config"
disallow_untyped_calls = true

disallow_any_generic = false
strict_equality = true
