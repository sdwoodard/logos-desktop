[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
dependencies = [
    "distro",
    "packaging",
    "psutil",
    "pythondialog",
    "requests",
    "olefile>=0.47,<1",
    "zstandard>=0.23,<1",
    "inotify", # Required for watching when the auto-update setting changes
    "textual",
]
name = "logos-desktop"
description = "Independent community installer and manager for Logos on Linux through Wine"
dynamic = ["version"]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT AND ISC"
license-files = ["LICENSE", "logos_desktop/img/lucide-LICENSE.txt", "packaging/LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]
gui = ["PySide6-Essentials>=6.12,<6.13"]

[project.scripts]
logos-desktop = "logos_desktop.main:main"
logos-desktop-controller-install = "logos_desktop.controller_install:main"
logos-desktop-install-wheel = "logos_desktop.controller_install:bootstrap"

[project.urls]
Source = "https://github.com/sdwoodard/logos-desktop"
Issues = "https://github.com/sdwoodard/logos-desktop/issues"

[tool.setuptools.dynamic]
version = {attr = "logos_desktop.constants.APP_VERSION"}

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["logos_desktop", "logos_desktop.*"]
namespaces = false

[tool.setuptools.package-data]
logos_desktop = [
    "assets/LogosStubFailOK.mst",
    "img/logos-desktop-icon.png",
    "img/logos-desktop.svg",
    "img/lucide-LICENSE.txt",
    "img/ATTRIBUTION.md",
]

[tool.setuptools.data-files]
"share/doc/logos-desktop" = [
    "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "LICENSE",
]
"share/doc/logos-desktop/docs" = [
    "docs/README.md", "docs/INSTALL.md", "docs/PACKAGING.md", "docs/CONFIGURATION.md",
    "docs/SUPPORT.md", "docs/BACKUPS.md", "docs/COMPATIBILITY.md", "docs/ARCHITECTURE.md",
    "docs/ROADMAP.md", "docs/NOTICES.md",
]
"share/doc/logos-desktop/docs/media" = [
    "docs/media/home-light.png", "docs/media/home-dark.png", "docs/media/social-preview.svg",
    "docs/media/tools-light.png", "docs/media/tools-dark.png",
    "docs/media/linux-badge.svg", "docs/media/python-badge.svg", "docs/media/license-badge.svg",
]
"share/doc/logos-desktop/logos_desktop/img" = [
    "logos_desktop/img/logos-desktop.svg", "logos_desktop/img/ATTRIBUTION.md", "logos_desktop/img/lucide-LICENSE.txt",
]
"share/doc/logos-desktop/packaging" = ["packaging/logos-desktop.desktop", "packaging/LICENSE"]
"share/doc/logos-desktop/scripts" = ["scripts/install-wheel.py"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
warn_unreachable = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "logos_desktop.config"
disallow_untyped_calls = true

disallow_any_generic = false
strict_equality = true
