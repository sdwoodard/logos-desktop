name: Private development checks
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    if: github.repository == 'sdwoodard/logos-desktop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install reviewed runtime dependencies
        run: python -m pip install .
      - name: Run the full inexpensive offline suite
        run: >-
          python -B -m unittest discover -s tests -t . -p 'test*.py' -v

  qt-tests:
    if: github.repository == 'sdwoodard/logos-desktop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install reviewed Qt components
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libegl1 libxkbcommon0 libdbus-1-3
          python -m pip install '.[gui]'
      - name: Run actual Qt adapter checks without skips
        run: |
          python -B - <<'PY'
          import unittest
          from PySide6 import QtCore, QtGui, QtWidgets
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_qt_frontend', 'tests.test_qt_theme',
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PY
