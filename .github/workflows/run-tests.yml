name: Private development checks
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    if: github.repository == 'sdwoodard/logos-desktop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install reviewed runtime dependencies
        run: python -m pip install .
      - name: Run the full inexpensive offline suite
        run: >-
          python -B -m unittest discover -s tests -t . -p 'test*.py' -v
